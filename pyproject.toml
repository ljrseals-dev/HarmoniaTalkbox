[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonia-talkbox"
version = "1.0.0"
description = "A physical-model talk-box pipeline: Karplus-Strong guitar string through a 48-section Kelly-Lochbaum vocal tract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Research/Non-Commercial" }
authors = [
    { name = "Lewis James Seals Jr.", email = "ljrseals@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Synthesis",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0"
]

[project.urls]
Homepage = "https://github.com/ljrseals-dev/HarmoniaTalkbox"
Repository = "https://github.com/ljrseals-dev/HarmoniaTalkbox"
