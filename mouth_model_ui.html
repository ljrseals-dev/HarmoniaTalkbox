<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Harmonia Talkbox - Browser UI</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 400px; }
        h1 { margin-top: 0; font-size: 1.2rem; color: #4CAF50; text-align: center; letter-spacing: 1px; }
        .control-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: #4CAF50; }
        .row { display: flex; gap: 1rem; }
        .row > * { flex: 1; }
        button { width: 100%; padding: 1rem; background: #4CAF50; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:hover { background: #45a049; }
        button:active { background: #3d8b40; transform: scale(0.98); }
        .status { text-align: center; font-size: 0.8rem; color: #666; margin-top: 1rem; }
        .presets { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .presets button { padding: 0.5rem; font-size: 0.8rem; background: #333; }
        .presets button:hover { background: #444; }
    </style>
</head>
<body>

<div class="card">
    <h1>HARMONIA TALKBOX</h1>
    
    <div class="control-group">
        <label>Pitch (MIDI Note: <span id="pitch-val">52 (E3)</span>)</label>
        <input type="range" id="pitch" min="40" max="76" value="52">
    </div>

    <div class="control-group">
        <label>Vowel Morph (Ah <-> Oo)</label>
        <input type="range" id="vowel" min="0" max="1" step="0.01" value="0.5">
        <div class="presets">
            <button onclick="setVowel(0)">Ah</button>
            <button onclick="setVowel(0.25)">Eh</button>
            <button onclick="setVowel(0.5)">Ee</button>
            <button onclick="setVowel(0.75)">Oh</button>
            <button onclick="setVowel(1)">Oo</button>
        </div>
    </div>

    <button id="playBtn">Pluck String</button>
    <div class="status" id="status">Click to initialize audio</div>
</div>

<script>
    let audioCtx;
    let isInit = false;

    // Formant Targets (Ah = 0.0, Oo = 1.0)
    const FORMANTS = {
        ah: { f1: 730, f2: 1090, f3: 2440 },
        oo: { f1: 300, f2: 870,  f3: 2240 }
    };

    const pitchSlider = document.getElementById('pitch');
    const vowelSlider = document.getElementById('vowel');
    const pitchVal = document.getElementById('pitch-val');
    const status = document.getElementById('status');

    pitchSlider.addEventListener('input', (e) => {
        let midi = parseInt(e.target.value);
        let freq = 440 * Math.pow(2, (midi - 69) / 12);
        pitchVal.textContent = `${midi} (${freq.toFixed(1)} Hz)`;
    });

    function setVowel(val) {
        vowelSlider.value = val;
    }

    function initAudio() {
        if (isInit) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isInit = true;
        status.textContent = "Audio Context Ready";
    }

    document.getElementById('playBtn').addEventListener('click', () => {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const midi = parseInt(pitchSlider.value);
        const freq = 440 * Math.pow(2, (midi - 69) / 12);
        const vowelPos = parseFloat(vowelSlider.value);

        // 1. Karplus-Strong String Synthesis (Delay + Feedback)
        const delayTime = 1 / freq;
        const delay = audioCtx.createDelay();
        delay.delayTime.value = delayTime;

        const feedback = audioCtx.createGain();
        feedback.gain.value = 0.98; // Decay

        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 2000;

        // Noise burst (Pluck)
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // 2. Vocal Tract Formants (Cascaded Bandpass Filters)
        const f1 = audioCtx.createBiquadFilter();
        const f2 = audioCtx.createBiquadFilter();
        const f3 = audioCtx.createBiquadFilter();
        
        f1.type = 'bandpass'; f2.type = 'bandpass'; f3.type = 'bandpass';
        f1.Q.value = 10; f2.Q.value = 15; f3.Q.value = 20;

        // Interpolate formants based on the slider
        f1.frequency.value = FORMANTS.ah.f1 * (1 - vowelPos) + FORMANTS.oo.f1 * vowelPos;
        f2.frequency.value = FORMANTS.ah.f2 * (1 - vowelPos) + FORMANTS.oo.f2 * vowelPos;
        f3.frequency.value = FORMANTS.ah.f3 * (1 - vowelPos) + FORMANTS.oo.f3 * vowelPos;

        // Routing: Noise -> Delay Loop -> Formants -> Out
        noise.connect(delay);
        delay.connect(lowpass);
        lowpass.connect(feedback);
        feedback.connect(delay);

        delay.connect(f1);
        f1.connect(f2);
        f2.connect(f3);
        f3.connect(audioCtx.destination);

        noise.start();
        // Stop the noise source after it seeds the delay line
        noise.stop(audioCtx.currentTime + 0.05);
    });
</script>
</body>
</html>
